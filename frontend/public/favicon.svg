<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: romance-600 (#e11d48) to rose-400 (#fb7185) from bottom-left to top-right -->
    <linearGradient id="romanceGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="30%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Subtle soft shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#881337" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Container matching Navbar Logo -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="112" 
    ry="112" 
    fill="url(#romanceGradient)" 
    filter="url(#softShadow)"
  />

  <!-- White Heart Icon (Lucide Heart matching Navbar) -->
  <g transform="translate(106, 106) scale(12.5)">
    <path 
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="1.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
